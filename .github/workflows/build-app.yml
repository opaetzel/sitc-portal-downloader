name: Wails build

on: [push]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build: [
          {name: SITC-pieces-downloader, platform: linux/amd64, os: debian-latest},
          {name: SITC-pieces-downloader, platform: windows/amd64, os: windows-latest}
        ]
    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: recursive
      - uses: dAppServer/wails-build-action@v2.2
        with:
          build-name: ${{ matrix.build.name }}
          build-platform: ${{ matrix.build.platform }}
          wails-version: v2.9.2